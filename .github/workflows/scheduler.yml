name: 15-Minute Data Collector

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This ensures the $(date) command uses Nepal Time
    env:
      TZ: Asia/Kathmandu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This 'fetch-depth: 0' helps the robot see the full history for syncing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Collector
        run: python collector.py

      - name: Save Database and Logs
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. First, "stage" the changes so the robot knows what it's working with
          git add data/pollution_system.db logs/system.log
          
          # 2. Now sync with the website (this will now work!)
          git pull origin main --rebase

          # 3. Commit and Push
          git commit -m "Automated data update: $(date)" || echo "No changes to commit"
          git push origin main
