name: 15-Minute Data Collector

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to test it manually by clicking a button

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This line tells the GitHub computer to use Nepal Time
    env:
      TZ: Asia/Kathmandu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Collector
        run: python collector.py

      - name: Save Database and Logs
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Pull the latest changes from the website to avoid conflicts
          git pull origin main --rebase

          # 2. Add the new data
          git add data/pollution_system.db logs/system.log
          
          # 3. Save and Push
          git commit -m "Automated data update: $(date)" || echo "No changes to commit"
          git push origin main
