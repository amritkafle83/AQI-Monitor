name: 15-Minute Data Collector

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to test it manually by clicking a button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to version 4 (latest)

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to version 5
        with:
          python-version: '3.12' # Your specific Python version

      - name: Install dependencies
        run: |
          pip install pandas requests
          # sqlite3, os, logging, and datetime are already built into Python 3.12

      - name: Run Collector
        run: python collector.py

      - name: Save Database and Logs
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Check if there are changes before committing to avoid errors
          git add data/pollution_system.db logs/system.log
          git commit -m "Automated data update: $(date)" || echo "No changes to commit"
          git push
